# 用法：把这个文件放到你仓库的 .github/workflows/docker-build.yml，
# push 到 main 分支后自动构建并推送到 GHCR。
name: Build and Push playdriver

on:
  push:
    branches: [main]
    # 反向过滤：仓库内任何改动都重建镜像，只排除纯文档。
    # 避免新增 COPY 文件后忘记加入白名单，导致镜像静默过期。
    paths:
      - "**"
      - "!**.md"
  workflow_dispatch:  # 允许在 Actions 页面手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送到 GHCR 需要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像名固定为 playdriver：ghcr.io/<用户名>/playdriver
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max